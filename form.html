<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student registration form</title>
</head>
<body>
    <h2>Registration Form</h2>
    <form>
        First Name:
        <input type="text" name="fname"><br>
        Last Name:
        <input type="text" name="lname"><br>
        Father's Name:
        <input type="text" name="father"><br>
        Mother's Name:
        <input type="text" name="mother"><br>
        Date of Birth:
        <input type="date" name="dob"><br>
        Email:
        <input type="email" name="email"><br>
        Gender:
        <input type="radio" name="gender">Male
         <input type="radio" name="gender">Female<br>
        Choose Course:
        <select>
            <option>select</option>
            <option>Btech</option>
            <option>Mca</option>
            <option>BComm</option>
        </select>
        hobbies:
        <input type="checkbox" name="hobbies">singing
         <input type="checkbox" name="hobbies">dancing
         <input type="checkbox" name="hobbies">reading book
         <input type="checkbox" name="hobbies">playing cricket<br>

         Address:
         <textarea rows="5" cols="25">Address</textarea>
        
         Photo:
         <input type="file" name="Choose file">
    </form>
</body>
</html>
